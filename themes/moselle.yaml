  ha-dialog-max-width: 100vw

  # Dialog animation
  ha-dialog-show-duration: 200ms
  ha-dialog-hide-duration: 200ms

  # Dialog surface
  ha-dialog-surface-background: 'var(--primary-background-color)'

  # ==================================================
  # LAYOUT & PANEL STYLES
  # ==================================================

  # Automation editor
  ha-automation-editor-width: 1540px
  ha-automation-editor-max-width: 'var(--ha-automation-editor-width, 1540px)'

  # Bottom sheet
  ha-bottom-sheet-surface-background: 'var(--ha-color-surface-default)'

  # Ripple effects
  ha-ripple-color: 'var(--primary-color)'
