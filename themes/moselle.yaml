  # Section grid layout
  ha-section-grid-row-gap: 'var(--ha-space-2)'
  ha-section-grid-column-gap: 'var(--ha-space-2)'
  ha-section-grid-row-height: 'var(--ha-space-14)'

  # ==================================================
  # CARD STYLES (hui-card-* components)
  # ==================================================

  # Card border and styling
  ha-badge-border-radius: 'var(--ha-border-radius-md)'
  ha-card-border-radius: 'var(--ha-border-radius-md)'
  ha-card-border-width: 0
  ha-card-border-color: transparent
  ha-card-box-shadow: none

  # Card header
  ha-card-header-color: 'var(--primary-text-color)'
  ha-card-header-font-family: 'var(--ha-font-family-body)'
  ha-card-header-font-size: 'var(--ha-font-size-2xl)'

  # Card background
  ha-card-background: 'var(--bubble-button-main-background-color)'

  # ==================================================
  # DIALOG STYLES (ha-dialog, ha-wa-dialog)
  # ==================================================

