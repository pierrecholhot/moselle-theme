  # ==================================================
  # CORE STYLES (core.globals.ts)
  # ==================================================

  # Border widths
  ha-border-width-sm: 1px
  ha-border-width-md: 2px
  ha-border-width-lg: 3px

  # Border radius
  ha-border-radius-sm: 4px
  ha-border-radius-md: 8px
  ha-border-radius-lg: 12px
  ha-border-radius-xl: 16px
  ha-border-radius-2xl: 20px
  ha-border-radius-3xl: 24px
  ha-border-radius-4xl: 28px
  ha-border-radius-5xl: 32px
  ha-border-radius-6xl: 36px
  ha-border-radius-pill: 9999px
  ha-border-radius-circle: 50%
  ha-border-radius-square: 0

  # Spacing
  ha-space-0: 0px
  ha-space-1: 4px
  ha-space-2: 8px
  ha-space-3: 12px
  ha-space-4: 16px
  ha-space-5: 20px
  ha-space-6: 24px
  ha-space-7: 28px
  ha-space-8: 32px
  ha-space-9: 36px
  ha-space-10: 40px
  ha-space-11: 44px
  ha-space-12: 48px
  ha-space-13: 52px
  ha-space-14: 56px
  ha-space-15: 60px
  ha-space-16: 64px
  ha-space-17: 68px
  ha-space-18: 72px
  ha-space-19: 76px
  ha-space-20: 80px

  # ==================================================
  # MAIN STYLES (main.globals.ts)
  # ==================================================

  # Height
  header-height: 'var(--ha-space-12)'

  # Opacity for dark text on light background
  dark-divider-opacity: 0.12
  dark-disabled-opacity: 0.38
  dark-secondary-opacity: 0.54
  dark-primary-opacity: 0.87

  # Opacity for light text on dark background
  light-divider-opacity: 0.12
  light-disabled-opacity: 0.3
  light-secondary-opacity: 0.7
  light-primary-opacity: 1

  # Direction
  direction: ltr
  float-start: left
  float-end: right
  margin-title-ltr: 0 0 0 24px
  margin-title-rtl: 0 24px 0 0

  # Safe area insets
  safe-area-inset-top: 'var(--app-safe-area-inset-top, env(safe-area-inset-top, 0))'
  safe-area-inset-bottom: 'var(--app-safe-area-inset-bottom, env(safe-area-inset-bottom, 0))'
  safe-area-inset-left: 'var(--app-safe-area-inset-left, env(safe-area-inset-left, 0))'
  safe-area-inset-right: 'var(--app-safe-area-inset-right, env(safe-area-inset-right, 0))'

  # ==================================================
  # TYPOGRAPHY STYLES (typography.globals.ts)
  # ==================================================

  # Font families
  ha-font-family-body: 'Roboto, Noto, sans-serif'
  ha-font-family-code: monospace
  ha-font-family-longform: 'ui-sans-serif, system-ui, sans-serif'

  # Font sizes
  ha-font-size-xs: 'calc(10px * var(--ha-font-size-scale, 1))'
  ha-font-size-s: 'calc(12px * var(--ha-font-size-scale, 1))'
  ha-font-size-m: 'calc(14px * var(--ha-font-size-scale, 1))'
  ha-font-size-l: 'calc(16px * var(--ha-font-size-scale, 1))'
  ha-font-size-xl: 'calc(20px * var(--ha-font-size-scale, 1))'
  ha-font-size-2xl: 'calc(24px * var(--ha-font-size-scale, 1))'
  ha-font-size-3xl: 'calc(28px * var(--ha-font-size-scale, 1))'
  ha-font-size-4xl: 'calc(32px * var(--ha-font-size-scale, 1))'
  ha-font-size-5xl: 'calc(40px * var(--ha-font-size-scale, 1))'
  ha-font-size-scale: 1
  ha-font-size-2xs: 'calc(8px * var(--ha-font-size-scale, 1))'

  # Font weights
  ha-font-weight-light: 300
  ha-font-weight-normal: 400
  ha-font-weight-medium: 500
  ha-font-weight-bold: 700

  # Font weight contexts
  ha-font-family-heading: 'var(--ha-font-family-body)'
  ha-font-weight-body: 'var(--ha-font-weight-normal)'
  ha-font-weight-heading: 'var(--ha-font-weight-bold)'
  ha-font-weight-action: 'var(--ha-font-weight-medium)'

  # Line heights
  ha-line-height-condensed: 1.2
  ha-line-height-normal: 1.6
  ha-line-height-expanded: 2

  # Font smoothing
  ha-font-smoothing: antialiased
  ha-moz-osx-font-smoothing: grayscale

  # Vaadin typography
  material-h6-font-size: 'var(--ha-font-size-m)'
  material-small-font-size: 'var(--ha-font-size-xs)'
  material-caption-font-size: 'var(--ha-font-size-2xs)'
  material-button-font-size: 'var(--ha-font-size-xs)'

  # Material Design list fonts
  md-list-item-label-text-font: 'var(--ha-font-family-body)'
  md-list-item-supporting-text-font: 'var(--ha-font-family-body)'
  md-list-item-trailing-supporting-text-font: 'var(--ha-font-family-body)'
  md-list-container-color: 'transparent'

  md-sys-color-surface: 'transparent'

