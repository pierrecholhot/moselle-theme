  # ==================================================
  # VIEW STYLES (hui-sections-view.ts, hui-view-background.ts)
  # ==================================================

  # View sections layout
  ha-view-sections-row-height: 'var(--ha-space-14)'
  ha-view-sections-row-gap: 'var(--ha-space-2)'
  ha-view-sections-column-gap: 'var(--ha-space-8)'
  ha-view-sections-column-max-width: '480px'
  ha-view-sections-column-min-width: '360px'
  ha-view-sections-extra-top-margin: 'var(--ha-space-20)'

  # View background
  lovelace-background: 'var(--primary-background-color)'
  view-background: 'radial-gradient(circle at 70% 35%, rgba(0, 150, 136, 0.3) 10%, transparent 50%), radial-gradient(circle at 55% 85%, rgba(147, 51, 234, 0.35) 0%, transparent 50%), radial-gradient(circle at 75% 60%, rgba(236, 72, 153, 0.3) 0%, transparent 50%), radial-gradient(circle at 45% 70%, rgba(var(--rgb-primary-background-color), 0.25) 0%, transparent 50%), radial-gradient(circle at 80% 90%, rgba(var(--rgb-primary-background-color), 0.3) 0%, transparent 50%), rgba(var(--rgb-primary-background-color), 1)'
