      view-background-opacity: 0.3

      bubble-border-radius: 'var(--ha-border-radius-md)'
      bubble-main-background-color: 'var(--ha-card-background)'
      bubble-secondary-background-color: 'var(--card-background-color)'
      bubble-icon-background-color: 'rgba(var(--rgb-primary-background-color), 0.94)'
      bubble-icon-color: 'var(--accent-color)'
      bubble-button-accent-color: 'rgba(var(--rgb-primary-color), 0.1)'
      bubble-climate-button-background-color: 'var(--bubble-icon-background-color)'
